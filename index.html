<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitoreo Virtual · UEES</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<div class="app-shell" id="appShell">
  <div class="panel" style="max-width:440px;margin:60px auto;text-align:center;">
    <div class="header-logo" style="margin:0 auto 20px;width:90px;height:90px;">
      <img src="assets/img/logo.png" alt="UEES" style="max-width:100%;max-height:100%;object-fit:contain;">
    </div>
    <h1 style="color:var(--navy);font-size:1.35rem;font-weight:700;margin:0;">Monitor Virtual</h1>
    <p class="muted" style="margin-bottom:24px;">Universidad Evangélica de El Salvador</p>

    <form id="formLogin" style="text-align:left;">
      <div class="mb-3">
        <label class="form-label">Usuario</label>
        <input type="text" class="form-control" id="usuario" placeholder="monitor.fccee" required autofocus autocomplete="username">
      </div>
      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <div id="loginError" class="text-danger small mb-2" style="min-height:20px;text-align:center;"></div>
      <button type="submit" class="btn-brand w-100" id="btnLogin">
        <i class="bi bi-box-arrow-in-right me-1"></i>Iniciar sesión
      </button>
    </form>

    <p class="text-muted mt-4" style="font-size:.78rem;">
      Ciclo 02-2026 · Dirección de Tecnología Educativa
    </p>
  </div>
</div>

<div class="toast-stack" id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  // Si ya hay sesión, redirigir
  const sesion = API.sesionObtener();
  if (sesion) {
    window.location.href = "pages/dashboard.html";
    return;
  }

  const form = document.getElementById("formLogin");
  form.onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById("btnLogin");
    const err = document.getElementById("loginError");
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Validando...';
    err.textContent = "";

    const usuario = document.getElementById("usuario").value.trim();
    const password = document.getElementById("password").value;

    const u = await API.login(usuario, password);
    if (u) {
      window.location.href = "pages/dashboard.html";
    } else {
      err.textContent = "Usuario o contraseña incorrectos";
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i>Iniciar sesión';
    }
  };
});
</script>
</body>
</html>
