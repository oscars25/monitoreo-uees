<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administración · Monitor Virtual UEES</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>

<div class="app-shell">
  <header class="app-header">
    <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 position-relative">
      <div class="d-flex align-items-start gap-3">
        <div class="header-logo"><img src="../assets/img/logo.png" alt="UEES"></div>
        <div>
          <h1>Administración</h1>
          <p><span id="hdrNombre">—</span></p>
        </div>
      </div>
      <div class="d-flex gap-2 flex-wrap">
        <a href="dashboard.html" class="btn-ghost-light"><i class="bi bi-eye me-1"></i>Dashboard</a>
        <a href="perfil.html" class="btn-ghost-light"><i class="bi bi-person me-1"></i>Mi perfil</a>
        <button id="btnLogout" class="btn-ghost-light"><i class="bi bi-box-arrow-right me-1"></i>Salir</button>
      </div>
    </div>
  </header>

  <ul class="nav nav-pills mb-3 admin-tabs mt-3" id="tabsAdmin">
    <li class="nav-item"><button class="nav-link active" data-tab="usuarios"><i class="bi bi-people me-1"></i>Usuarios</button></li>
    <li class="nav-item"><button class="nav-link" data-tab="semanas"><i class="bi bi-calendar-week me-1"></i>Semanas</button></li>
    <li class="nav-item"><button class="nav-link" data-tab="asignaturas"><i class="bi bi-journal-text me-1"></i>Asignaturas</button></li>
    <li class="nav-item"><button class="nav-link" data-tab="evaluaciones"><i class="bi bi-clipboard-data me-1"></i>Evaluaciones</button></li>
    <li class="nav-item"><button class="nav-link" data-tab="flujos"><i class="bi bi-link-45deg me-1"></i>Flujos de correo</button></li>
  </ul>

  <div class="panel">
    <div id="tabContent">
      <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
    </div>
  </div>
</div>

<div class="toast-stack" id="toasts"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/admin.js"></script>
</body>
</html>
